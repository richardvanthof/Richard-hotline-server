<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }

        label {
            margin-bottom: 5px;
        }
        .form-content {
            margin-bottom: 15px;
        };
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Password</h1>
        <form class="form-content" id="resetPasswordForm">
            <input type="hidden" id="token" name="token" value="">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <button type="submit">Reset Password</button>
        </form>
        <div id="message" class="error"></div>
    </div>
    <script>
        const removeFormContent = () => {
            document.querySelectorAll('.form-content').forEach(elem => elem.remove());
        };

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            if (token) {
                document.getElementById('token').value = token;
                document.getElementById('message').className = 'error';
            } else {
                document.getElementById('message').textContent = 'No token provided.';
                removeFormContent();
            }

            const form = document.getElementById('resetPasswordForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const token = document.getElementById('token').value;

                if (newPassword !== confirmPassword) {
                    document.getElementById('message').textContent = 'Passwords do not match.';
                    return;
                }

                try {
                    const response = await fetch('/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token, newPassword })
                    });

                    const data = await response.json();
                    if (response.ok) {
                        removeFormContent();
                        document.getElementById('message').className = 'success';
                        document.getElementById('message').textContent = data.message || 'Password reset successfully.';
                    } else {
                        document.getElementById('message').className = 'error';
                    
                        if(data.errors && Array.isArray(data.errors)) {
                            document.getElementById('message').textContent = data.errors.map(err => err.message).join(', ');
                        } else {
                            document.getElementById('message').textContent = data.message || data.error || 'Failed to reset password.';
                        }
                        
                    }
                } catch (error) {
                    document.getElementById('message').className = 'error';
                    document.getElementById('message').textContent = 'An error occurred. Please try again.';
                }
            });
        });
    </script>
</body>
</html>
